name: Daily update

on:
  schedule:
    # 21:30 UTC Mon–Fri = 5:30am Malaysia time Tue–Sat, after the US market closes.
    # This early run often misses the latest close (Yahoo hasn't settled it yet,
    # and GitHub usually starts scheduled runs 2–5 hours late).
    - cron: "30 21 * * 1-5"
    # Catch-up run: 10:00 UTC Tue–Sat = 6pm Malaysia time, well after Yahoo has
    # the final close and still hours before the next US open (9:30pm Malaysia).
    - cron: "0 10 * * 2-6"
  workflow_dispatch:        # adds a "Run workflow" button for manual runs

permissions:
  contents: write           # save the new data.json back to the repo
  pages: write              # publish the website
  id-token: write

concurrency:
  group: daily-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install packages
        run: pip install -r requirements.txt

      - name: Build data
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}   # optional; skip AI summary if not set
        run: python build.py

      - name: Save data to the repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/*.json
          git diff --staged --quiet || git commit -m "Daily data update $(date -u +%F)"
          git push

      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: docs
      - id: deploy
        uses: actions/deploy-pages@v5
